# .github/workflows/release-foss.yml
name: F-Droid FOSS

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+-FOSS'

jobs:
  build:
    name: Build and publish F-Droid style repo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.4'

      - name: Build APK
        run: ./gradlew app:assembleFossRelease

      - name: Get version info
        id: version_info
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          
          # Extract versioning variables directly from the gradle file
          CANONICAL_VC=$(grep 'val canonicalVersionCode = ' app/build.gradle.kts | cut -d' ' -f4)
          MAX_HOTFIX_V=$(grep 'val maxHotfixVersions = ' app/build.gradle.kts | cut -d' ' -f4)
          GRAPHENE_REV=$(grep 'val grapheneRevision = ' app/build.gradle.kts | cut -d' ' -f4)
          CURRENT_HOTFIX_V=$(grep 'val currentHotfixVersion = ' app/build.gradle.kts | cut -d' ' -f4)

          # Calculate versionCode using the same formula as in app/build.gradle.kts
          VERSION_CODE=$(( (CANONICAL_VC * MAX_HOTFIX_V) + GRAPHENE_REV + CURRENT_HOTFIX_V ))
          
          echo "versionName=${TAG}" >> $GITHUB_OUTPUT
          echo "versionCode=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "packageName=it.aitechnology.graphene" >> $GITHUB_OUTPUT

      - name: Sign APK
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/foss/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename APK
        id: rename_apk
        run: |
          VERSION_NAME=${{ steps.version_info.outputs.versionName }}
          SIGNED_APK_PATH=${{ steps.sign_apk.outputs.signedReleaseFile }}
          NEW_APK_NAME="Graphene-${VERSION_NAME}-signed.apk"
          mv "$SIGNED_APK_PATH" "$NEW_APK_NAME"
          echo "apkName=${NEW_APK_NAME}" >> $GITHUB_OUTPUT
          echo "apkPath=${PWD}/${NEW_APK_NAME}" >> $GITHUB_OUTPUT

      - name: Generate SHA256 hash for APK
        id: hash
        run: |
          APK_PATH=${{ steps.rename_apk.outputs.apkPath }}
          HASH=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          echo "apkSha256=${HASH}" >> $GITHUB_OUTPUT

      - name: Create index-v1.json
        id: create_json
        run: |
          # Data extracted from previous steps
          VERSION_NAME=${{ steps.version_info.outputs.versionName }}
          VERSION_CODE=${{ steps.version_info.outputs.versionCode }}
          PACKAGE_NAME=${{ steps.version_info.outputs.packageName }}
          APK_NAME=${{ steps.rename_apk.outputs.apkName }}
          APK_HASH=${{ steps.hash.outputs.apkSha256 }}

          # Create the JSON file with the correct structure
          cat > index-v1.json << EOF
          {
            "apps": [
              {
                "packageName": "${PACKAGE_NAME}",
                "suggestedVersionCode": ${VERSION_CODE}
              }
            ],
            "packages": {
              "${PACKAGE_NAME}": [
                {
                  "versionName": "${VERSION_NAME}",
                  "versionCode": ${VERSION_CODE},
                  "apkName": "${APK_NAME}",
                  "hash": "${APK_HASH}"
                }
              ]
            }
          }
          EOF
          echo "Created index-v1.json:"
          cat index-v1.json

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ steps.rename_apk.outputs.apkPath }}
            index-v1.json
          body: "Release for Graphene version ${{ steps.version_info.outputs.versionName }}"
